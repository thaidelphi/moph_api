<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <title>ออกจากระบบสำเร็จ</title>
    <style>
        body { font-family: "Sarabun", sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; }
        .success-icon { color: #28a745; font-size: 50px; margin-bottom: 15px; }
        h2 { color: #333; font-size: 22px; margin: 10px 0; }
        p { color: #666; font-size: 15px; margin-bottom: 30px; line-height: 1.5; }
        .btn-home { background-color: #007bff; color: white; padding: 12px 24px; text-decoration: none; border-radius: 5px; font-weight: bold; display: inline-block; transition: 0.3s; width: 100%; box-sizing: border-box; }
        .btn-home:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="box">
        <div class="success-icon">✔️</div>
        <h2>ออกจากระบบเรียบร้อยแล้ว</h2>
        <p>การเชื่อมต่ออินเทอร์เน็ตของท่านถูกตัดแล้ว<br>หากต้องการใช้งานอินเทอร์เน็ตอีกครั้ง กรุณาเชื่อมต่อ WiFi และเข้าสู่ระบบใหม่</p>
        <a href="/" class="btn-home">กลับหน้าหลัก</a>
    </div>
</body>
</html>
