<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <title>แก้ไขโปรไฟล์</title>
    <style>
        body { font-family: "Sarabun", sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h2 { color: #333; font-size: 24px; margin-top: 0; margin-bottom: 25px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #555; font-weight: 500; font-size: 15px; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; font-family: "Sarabun", sans-serif; box-sizing: border-box; transition: 0.3s; }
        .form-control:focus { border-color: #007bff; outline: none; box-shadow: 0 0 0 3px rgba(0,123,255,0.1); }
        .btn-submit { background-color: #007bff; color: white; padding: 12px 24px; border: none; border-radius: 6px; font-weight: 600; font-size: 16px; cursor: pointer; width: 100%; transition: 0.3s; font-family: "Sarabun", sans-serif; margin-top: 10px; }
        .btn-submit:hover { background-color: #0056b3; }
        .btn-back { display: block; text-align: center; margin-top: 20px; color: #6c757d; text-decoration: none; font-size: 14px; transition: 0.3s; }
        .btn-back:hover { color: #343a40; text-decoration: underline; }
        .alert { padding: 15px; margin-bottom: 20px; border-radius: 6px; font-size: 14px; display: none; }
        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .password-note { font-size: 13px; color: #888; margin-top: 5px; display: block; }
    </style>
</head>
<body>
    <div class="box">
        <h2>แก้ไขข้อมูลโปรไฟล์</h2>
        
        <div id="alertBox" class="alert"></div>
        
        <form id="profileForm" method="POST" action="/sso/profile">
            <div class="form-group">
                <label for="username">ชื่อผู้ใช้งาน (Username)</label>
                <input type="text" id="username" class="form-control" value="{{USERNAME}}" disabled>
                <span class="password-note">ชื่อผู้ใช้งานไม่สามารถเปลี่ยนแปลงได้</span>
            </div>
            
            <div class="form-group">
                <label for="fullname">ชื่อ-นามสกุล</label>
                <input type="text" id="fullname" name="fullname" class="form-control" value="{{FULLNAME}}" required>
            </div>
            
            <div class="form-group">
                <label for="email">อีเมล</label>
                <input type="email" id="email" name="email" class="form-control" value="{{EMAIL}}">
            </div>
            
            <div class="form-group">
                <label for="phone">เบอร์โทรศัพท์</label>
                <input type="tel" id="phone" name="phone" class="form-control" value="{{PHONE}}">
            </div>
            
            <div class="form-group">
                <label for="password">รหัสผ่านใหม่ (Change Password)</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="กรอกรหัสผ่านใหม่เมื่อต้องการเปลี่ยน">
                <span class="password-note">หากไม่ต้องการเปลี่ยนรหัสผ่าน ให้เว้นว่างไว้</span>
            </div>
            
            <button type="submit" class="btn-submit">บันทึกข้อมูล</button>
            <a href="/sso/status" class="btn-back">กลับไปหน้าสถานะ</a>
        </form>
    </div>

    <script>
        // Check for success or error in URL params
        const urlParams = new URLSearchParams(window.location.search);
        const alertBox = document.getElementById('alertBox');
        
        if (urlParams.has('success')) {
            alertBox.textContent = 'บันทึกข้อมูลโปรไฟล์เรียบร้อยแล้ว';
            alertBox.className = 'alert alert-success';
            alertBox.style.display = 'block';
        } else if (urlParams.has('error')) {
            alertBox.textContent = urlParams.get('error') || 'เกิดข้อผิดพลาดในการบันทึกข้อมูล';
            alertBox.className = 'alert alert-error';
            alertBox.style.display = 'block';
        }
    </script>
</body>
</html>
